name: Build Windows native

# Sur chaque tag v* : construit NEXUS.exe, l'installeur NEXUS-X.Y.Z-Setup.exe et le portable
# NEXUS-Portable-X.Y.Z.zip (outils/build.py : lint, tests, audit, PyInstaller, Inno Setup, SHA256),
# puis les publie s'ils manquent :
#   - installeur (+ .sha256) dans la release vX.Y.Z (celle que lisent les mises à jour automatiques) ;
#   - portable (+ .sha256) dans la pré-release portable-X.Y.Z (jamais dans vX.Y.Z : les versions source
#     prennent le dernier .zip de la release pour se mettre à jour).
# Si outils/release.py les a déjà envoyés depuis le PC, rien n'est remplacé (un seul fichier par version).
# Lancement manuel : construction et artefacts seulement, sans publication.
#
# Signature (désactivée par défaut) : secrets WINDOWS_CERT_PFX_BASE64 et WINDOWS_CERT_PFX_PASSWORD.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Le tag correspond au fichier VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} différent de VERSION ($v)" }

      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Environnement de build
        shell: pwsh
        run: |
          python -m venv .venv-build
          .venv-build\Scripts\python.exe -m pip install --disable-pip-version-check -q --upgrade pip

      - name: Construire (lint, tests, audit, exe, installeur, portable, SHA256)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          NEXUS_PFX_PASSWORD: ${{ secrets.WINDOWS_CERT_PFX_PASSWORD }}
        run: |
          $params = @("outils/build.py", "--depot", "${{ github.repository }}")
          if ($env:PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "nexus.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            $params += @("--pfx", $pfx)
            Write-Host "Signature Authenticode activée."
          } else {
            Write-Host "::warning::Aucun certificat configuré : exe et installeur non signés (SmartScreen)."
          }
          .venv-build\Scripts\python.exe @params

      - name: Empreintes
        shell: pwsh
        run: Get-Content dist/SHA256SUMS.txt

      - name: Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-native-${{ github.ref_name }}
          path: |
            dist/NEXUS-*-Setup.exe
            dist/NEXUS-*-Setup.exe.sha256
            dist/NEXUS-Portable-*.zip
            dist/NEXUS-Portable-*.zip.sha256
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publier (seulement les fichiers manquants)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"; $ver = $tag.Substring(1); $repo = "${{ github.repository }}"
          # La release vX.Y.Z est créée par outils/release.py (PC) ou par release.yml : on l'attend (10 min max).
          for ($i = 0; $i -lt 40; $i++) {
            gh release view $tag --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep 15
          }
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) { throw "release $tag introuvable : publie d'abord avec outils/release.py" }
          $assets = gh release view $tag --repo $repo --json assets --jq '.assets[].name'
          $setup = "NEXUS-$ver-Setup.exe"
          if ($assets -notcontains $setup) {
            gh release upload $tag "dist/$setup" "dist/$setup.sha256" --repo $repo
          } else { Write-Host "$setup déjà publié (outils/release.py) : rien à faire." }
          $ptag = "portable-$ver"; $zip = "NEXUS-Portable-$ver.zip"
          gh release view $ptag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $sha = (Get-Content "dist/$zip.sha256" -Raw).Split(" ")[0]
            $notes = "## Télécharger`n`n**[$zip](https://github.com/$repo/releases/download/$ptag/$zip)** — Windows 10/11 64 bits, aucune installation.`n`nDécompresse le ZIP où tu veux (clé USB comprise), lance NEXUS.exe. Toutes les données restent dans ce dossier.`nPour une installation classique avec raccourcis et mises à jour automatiques : [$setup](https://github.com/$repo/releases/tag/$tag).`n`nSHA256 : ``$sha``"
            $notes | Out-File notes-portable.md -Encoding utf8
            gh release create $ptag "dist/$zip" "dist/$zip.sha256" --repo $repo --target $tag --title "NEXUS $ver — version portable Windows" --notes-file notes-portable.md --prerelease --latest=false
          } else { Write-Host "$ptag déjà publiée (outils/release.py) : rien à faire." }
