# Intégration continue : tests, lint, validation des profils et détection de secrets à chaque push et pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests, lint et profils (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Formatage (ruff format)
        run: python -m ruff format --check .
      - name: Vulnérabilités des dépendances (pip-audit)
        run: python -m pip_audit -r requirements.txt -r requirements-native.txt --progress-spinner off
      - name: Profils visuels
        run: python valider_profil.py --tous
      - name: Tests
        run: python outils/tests/run_all.py
      - name: Données personnelles (fichiers suivis)
        run: python outils/scan_perso.py
      - name: Archive de release (construction à blanc)
        run: python outils/release.py --construire-seulement --depot "${{ github.repository }}"

  secrets:
    name: Détection de secrets (gitleaks, tout l'historique)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .
          ./gitleaks dir --no-banner --redact --exit-code 1 .
